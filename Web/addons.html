<!DOCTYPE html>
<html>
    <head>
        <title>tiny relay</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" type="text/css" href="css/style.css">
        <script defer src="js/common.js"></script>
        <script>
        var pnpslider, adcslider;
        document.addEventListener('DOMContentLoaded', function(event)
        {
            var nvram = new XMLHttpRequest();
            nvram.responseType = 'json';
            nvram.open('GET', 'nvram.json', true);
            nvram.send();
            nvram.onload = function(e) {
                if(nvram.response != undefined) {
                    if(nvram.response['nvram'][PLC_PASSWORD] != '')
                    {
                        PLCLOCK = true;
                    }
                }
            }
            document.getElementById('browseAddon').addEventListener('click', function() {
                if (PLCLOCK) {
                    RelayLogin();
                } else {
                    document.getElementById('fileAddon').click();
                }
            });
            document.getElementById('fileAddon').addEventListener('change', function() {
                document.getElementById('formAddon').setAttribute('action', 'http://' + window.location.hostname + '/addons'); // force HTTP
                progressTimer(80, 0);
                document.getElementById('formAddon').submit();
            });
            var addons = new XMLHttpRequest();
            addons.open('GET', 'api?addons=1', true);
            addons.send();
            addons.onload = function(e) {
                if(addons.response != undefined) {
                    var list = document.getElementById('addonsList');
                    addons.responseText.split('\n').forEach(function (item) {
                        //console.log(item);
                        if(item != "") {
                            var disabled = item.toLowerCase().endsWith('.disabled');
                            var listitemdiv = document.createElement('div');
                            listitemdiv.classList.add('addon-item');
                            if(disabled) {
                                listitemdiv.classList.add('addon-disabled');
                            }

                            var listremovebutton = document.createElement('button');
                            listremovebutton.id = item.toLowerCase();
                            listremovebutton.classList.add('btn', 'btn-red');
                            listremovebutton.textContent = 'Remove';
                            listremovebutton.addEventListener('click', function() {
                                var a = new XMLHttpRequest();
                                a.open('GET', 'api?&addons=1&remove=' + this.id, true);
                                a.onload = function(e) {
                                    if(a.response == 'OK') {
                                        location.reload();
                                    }else{
                                        notify('', 'Error ' + this.id, 'danger');
                                    }
                                }
                                a.send();
                            });
                            listitemdiv.appendChild(listremovebutton);

                            var listlabeldiv = document.createElement('div');
                            listlabeldiv.textContent = disabled ? item.toUpperCase() + ' (CRASHED)' : item.toUpperCase();
                            listlabeldiv.classList.add('addon-label', 'grow');
                            listitemdiv.appendChild(listlabeldiv);

                            if(disabled) {
                                var listenablebutton = document.createElement('button');
                                listenablebutton.id = item.toLowerCase();
                                listenablebutton.classList.add('btn', 'btn-green');
                                listenablebutton.textContent = 'Enable';
                                listenablebutton.addEventListener('click', function() {
                                    var a = new XMLHttpRequest();
                                    a.open('GET', 'api?&addons=1&enable=' + this.id, true);
                                    a.onload = function(e) {
                                        if(a.response == 'OK') {
                                            location.reload();
                                        }else{
                                            notify('', 'Error ' + this.id, 'danger');
                                        }
                                    }
                                    a.send();
                                });
                                listitemdiv.appendChild(listenablebutton);
                            } else {
                                var listrunbutton = document.createElement('button');
                                listrunbutton.id = item.toLowerCase();
                                listrunbutton.classList.add('btn', 'btn-green');
                                listrunbutton.textContent = 'Run';
                                listrunbutton.addEventListener('click', function() {
                                    var a = new XMLHttpRequest();
                                    var id = this.id;
                                    a.open('GET', 'api?&addons=1&run=' + id, true);
                                    a.onload = function(e) {
                                        var res = a.response;
                                        if(res == 'RUNNING') {
                                            notify('', id + ' Running', 'success');
                                        }else if(res == 'BUSY') {
                                            notify('', id + ' Busy (already running)', 'warning');
                                        }else if(res == 'OK') {
                                            notify('', id + ' Executed', 'success');
                                        }else if(res == 'Locked') {
                                            PLCLOCK = true;
                                            RelayLogin();
                                        }else{
                                            notify('', 'Error ' + res, 'danger');
                                        }
                                    }
                                    a.send();
                                });
                                listitemdiv.appendChild(listrunbutton);
                            }

                            list.appendChild(listitemdiv);
                        }
                    });
                }
            }
        });
        </script>
    </head>
    <body>
        <div class="modal-backdrop hidden" id="modal-backdrop"></div>

        <div class="page">
            <div class="nav">
                <button class="btn btn-gray" onclick="window.location.href='index.html'"><<</button>
                <button class="btn btn-green" onclick="window.location.href='addons.html'">Addons</button>
                <button class="btn btn-orange" onclick="window.location.href='firmware.html'">Firmware</button>
            </div>
            <div class="card">
                <div id="addonsList"></div>
            </div>
            <div class="card">
                <form method="POST" action="addons" enctype="multipart/form-data" id="formAddon">
                    <input type="file" accept=".bin" name="addon" id="fileAddon" class="hidden">
                    <input type="submit" class="hidden">
                </form>
                <button class="btn btn-accent btn-block" type="button" id="browseAddon">Upload Addon</button>
            </div>
        </div>
        <div id="notify"></div>
        <div class="modal hidden" id="demo-lock">
            <div class="modal-card">
                <div class="modal-header">
                    <h5>Login</h5>
                    <button class="modal-close" onclick="hideModal(this)">&times;</button>
                </div>
                <form method="POST" action="login" id="demo-lock-form">
                    <input type="password" id="DemoPassword" name="password" class="input" placeholder="Password" required>
                    <button type="submit" class="btn btn-green btn-block mt-4" id="demo-lock-ok">Login</button>
                </form>
            </div>
        </div>
    </body>
</html>
