<!DOCTYPE html>
<html>
    <head>
        <title>tiny relay</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" type="text/css" href="css/style.css">
        <script defer src="js/common.js"></script>
        <script>
        var pnpslider, adcslider;
        document.addEventListener('DOMContentLoaded', function(event)
        {
            var eeprom = new XMLHttpRequest();
            eeprom.responseType = 'json';
            eeprom.open('GET', 'eeprom.json', true);
            eeprom.send();
            eeprom.onload = function(e) {
                if(eeprom.response != undefined) {
                    if(eeprom.response['eeprom'][PLC_PASSWORD] != '')
                    {
                        PLCLOCK = true;
                    }
                    try {
                        var v = eeprom.response['eeprom'][0].split('|');
                        document.getElementById('coreVersion').textContent = 'Core Version: ' + v[0];
                        document.getElementById('sdkVersion').textContent = 'SDK Version: ' + v[1];
                        document.getElementById('fsVersion').textContent = 'LittleFS Version: ' + (0xffff & (v[2] >> 16)) + '.' + (0xffff & (v[2] >> 0)) + '.' + (0xffff & (v[2] >> 20));
                        document.getElementById('firmwareVersion').textContent = 'Firmware Version: ' + v[3];
                        document.getElementById('fsram').textContent = 'Flash: ' + Math.round(v[4]/1024) + ' KB (' + v[4] + ')';
                        document.getElementById('dram').textContent = 'Memory: ' + Math.round(v[5]/1024) + ' KB (' + v[5] + ')';
                    } catch (error) {
                        notify('', error, 'danger');
                    }
                }
            }
            document.getElementById('browseLittleFS').addEventListener('click', function() {
                if (PLCLOCK) {
                    RelayLogin();
                } else {
                    document.getElementById('fileLittleFS').click();
                }
            });

            document.getElementById('browseFirmware').addEventListener('click', function() {
                if (PLCLOCK) {
                    RelayLogin();
                } else {
                    document.getElementById('fileFirmware').click();
                }
            });

            document.getElementById('fileLittleFS').addEventListener('change', function() {
                document.getElementById('formLittleFS').setAttribute('action', 'http://' + window.location.hostname + '/update'); // force HTTP
                progressTimer(80, 0);
                document.getElementById('formLittleFS').submit();
            });

            document.getElementById('fileFirmware').addEventListener('change', function() {
                document.getElementById('formFirmware').setAttribute('action', 'http://' + window.location.hostname + '/update'); // force HTTP
                progressTimer(20, 0);
                document.getElementById('formFirmware').submit();
            });
        });
        </script>
    </head>
    <body>
        <div class="modal-backdrop hidden" id="modal-backdrop"></div>

        <div class="page">
            <div class="nav">
                <button class="btn btn-gray" onclick="window.location.href='index.html'"><<</button>
                <button class="btn btn-green" onclick="window.location.href='addons.html'">Addons</button>
                <button class="btn btn-orange" onclick="window.location.href='firmware.html'">Firmware</button>
            </div>
            <div class="card">
                    <small class="field">GUI Version: 1.0.0</small>
                    <small class="field" id="coreVersion">Core Version:</small>
                    <small class="field" id="sdkVersion">SDK Version:</small>
                    <small class="field" id="fsVersion">LittleFS Version:</small>
                    <small class="field" id="firmwareVersion">Firmware Version:</small>
                    <small class="field" id="fsram">Flash:</small>
                    <small class="field" id="dram">Memory:</small>
            </div>
            <div class="card">
                <div class="grid-2">
                    <div>
                        <form method="POST" action="update" enctype="multipart/form-data" id="formLittleFS">
                            <input type="file" accept=".bin,.signed" name="filesystem" id="fileLittleFS" class="hidden">
                            <input type="submit" class="hidden">
                        </form>
                        <button class="btn btn-accent btn-block" type="button" id="browseLittleFS">Flash LittleFS</button>
                    </div>
                    <div>
                        <form method="POST" action="update" enctype="multipart/form-data" id="formFirmware">
                            <input type="file" accept=".bin,.signed" name="firmware" id="fileFirmware" class="hidden">
                            <input type="submit" class="hidden">
                        </form>
                        <button class="btn btn-accent btn-block" type="button" id="browseFirmware">Flash Firmware</button>
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="progress">
                    <div class="progress-bar" style="width:0%"></div>
                </div>
            </div>
            <div class="card">
                <div class="center">
                    <button class="btn btn-red btn-block" type="button" onclick="resetFlash()">Default Reset</button>
                </div>
            </div>
        </div>
        <div class="modal hidden" id="demo-lock">
            <div class="modal-card">
                <div class="modal-header">
                    <h5>Login</h5>
                    <button class="modal-close" onclick="hideModal(this)">&times;</button>
                </div>
                <form method="POST" action="login" id="demo-lock-form">
                    <input type="password" id="DemoPassword" name="password" class="input" placeholder="Password" required>
                    <button type="submit" class="btn btn-green btn-block mt-4" id="demo-lock-ok">Login</button>
                </form>
            </div>
        </div>
    </body>
</html>
